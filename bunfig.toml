logLevel = "debug" # "debug" | "warn" | "error"
telemetry = false

[test]
coverage = false
pathIgnorePatterns = ["packages/skill-builder/tests", "tmp/*"]


[install.lockfile]
save = true

[install]
exact = true
optional = true
dev = true
peer = true
auto = "auto"

[fmt]
sortImports = true
ignorePatterns = ["**/*.md", "packages/cli-hook/tests/fixtures/**"]
quoteProps = "preserve"

[lint]
plugins = ["./lint/plugin.ts"]
ignorePatterns = ["packages/cli-hook/tests/fixtures/**"]

[lint.categories]
correctness = "error"
suspicious = "error"
pedantic = "error"
style = "error"

[lint.rules]
"eslint/no-console" = "off"
"eslint/no-template-curly-in-string" = "off"
"eslint/no-magic-numbers" = "off"
"eslint/no-ternary" = "error"
"eslint/curly" = ["error", "all"]
"eslint/sort-keys" = "error"
"eslint/no-unused-vars" = "error"
"eslint/max-lines-per-function" = ["error", { max = 50 }]
"eslint/max-lines" = ["error", { max = 400 }]
"eslint/id-length" = ["error", { min = 3 }]
"eslint/no-process-env" = "off"
"import/no-namespace" = "off"
"import/no-nodejs-modules" = "off"
"oxc/no-barrel-file" = "error"
"react/jsx-sort-props" = "error"
"one-var" = "off"
"eslint/capitalized-comments" = "off"
"eslint/func-style" = "off"
"eslint/no-inline-comments" = "off"
"eslint/sort-imports" = "off"
"import/no-named-export" = "off"
"import/group-exports" = "off"
"import/prefer-default-export" = "off"
"import/first" = "error"
"import/exports-last" = "off"
"typescript/prefer-readonly-parameter-types" = "off"
"unicorn/no-null" = "off"
"local/no-comments" = ["error", { allow = ["@effect-diagnostics"] }]
